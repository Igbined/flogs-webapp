<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Flogs Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#050505',
              card: '#0d0d0d',
              border: '#18181b',
              amber: '#d97706',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #050505;
      color: #e4e4e7;
    }
    .dark-card {
      background-color: #0d0d0d;
      border: 1px solid #1c1c21;
    }
    .action-card {
      background-color: #0d0d0d;
      border: 1px solid #1c1c21;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .action-card:hover {
      background-color: #141417;
      border-color: #27272a;
      transform: translateY(-2px);
    }
    .glass-nav {
      background: rgba(13, 13, 13, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      /* Native app safe-area padding for mobile home indicators */
      padding-bottom: env(safe-area-inset-bottom, 8px);
    }
  </style>
</head>
<body class="min-h-screen bg-brand-black text-gray-200 font-sans antialiased pb-28">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-brand-black/80 backdrop-blur-md border-b border-zinc-900 px-5 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-center">
        <svg class="w-5 h-5 text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
        </svg>
      </div>
      <span class="text-lg font-bold tracking-tight text-white">Flogs</span>
    </div>
    <button class="text-sm font-medium text-zinc-400 hover:text-white transition">
      Logout
    </button>
  </header>

  <main class="px-4 py-6 max-w-md mx-auto space-y-6">

    <!-- Greeting Section -->
    <div class="px-1 space-y-1">
      <h1 class="text-2xl font-bold tracking-tight text-white">Good evening, Igbinedion Fortune</h1>
      <p class="text-sm text-zinc-400 leading-relaxed">
        Create, configure, renew, and monitor your links — all in one place.
      </p>
    </div>

    <!-- Telegram Warning Banner -->
    <div class="dark-card rounded-2xl p-4 border-amber-900/40 bg-amber-950/10">
      <div class="flex items-start justify-between gap-3">
        <div class="flex items-start gap-3">
          <div class="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/20 flex items-center justify-center flex-shrink-0 mt-0.5">
            <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
          </div>
          <div>
            <h3 class="font-semibold text-amber-400 text-sm">Telegram Chat ID Required</h3>
            <p class="text-xs text-zinc-400 mt-1 leading-normal">
              Set your Telegram Chat ID to receive notifications and logs
            </p>
          </div>
        </div>
        <button class="flex items-center gap-1 text-xs font-semibold text-amber-400 hover:text-amber-300 transition whitespace-nowrap pt-0.5">
          Set Up <span>&rarr;</span>
        </button>
      </div>
    </div>

    <!-- Token Balance Card -->
    <div class="dark-card rounded-2xl p-5 relative overflow-hidden">
      <div class="absolute -right-3 -bottom-3 opacity-10 pointer-events-none">
        <svg class="w-28 h-28 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-yellow-500/10 border border-yellow-500/20 flex items-center justify-center">
          <svg class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <div>
          <p class="text-xs font-medium text-zinc-400">Token Balance</p>
          <p class="text-3xl font-extrabold text-white mt-0.5">0</p>
        </div>
      </div>
    </div>

    <!-- Total Links Card -->
    <div class="dark-card rounded-2xl p-5 relative overflow-hidden">
      <div class="absolute -right-3 -bottom-3 opacity-10 pointer-events-none">
        <svg class="w-28 h-28 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
        </svg>
      </div>
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center">
          <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
          </svg>
        </div>
        <div>
          <p class="text-xs font-medium text-zinc-400">Total Links</p>
          <p class="text-3xl font-extrabold text-white mt-0.5">0</p>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="pt-2">
      <h2 class="text-lg font-bold text-white mb-4 px-1">Quick Actions</h2>
      
      <div class="grid grid-cols-2 gap-3.5">
        
        <!-- Generate Link -->
        <button class="action-card rounded-2xl p-6 flex flex-col items-center justify-center gap-3 text-center">
          <div class="w-12 h-12 rounded-xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center">
            <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
          </div>
          <span class="text-xs font-semibold text-zinc-200">Generate Link</span>
        </button>

        <!-- My Links -->
        <button class="action-card rounded-2xl p-6 flex flex-col items-center justify-center gap-3 text-center">
          <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center">
            <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </div>
          <span class="text-xs font-semibold text-zinc-200">My Links</span>
        </button>

        <!-- Buy Credit -->
        <button class="action-card rounded-2xl p-6 flex flex-col items-center justify-center gap-3 text-center">
          <div class="w-12 h-12 rounded-xl bg-purple-500/10 border border-purple-500/20 flex items-center justify-center">
            <svg class="w-6 h-6 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
            </svg>
          </div>
          <span class="text-xs font-semibold text-zinc-200">Buy Credit</span>
        </button>

        <!-- Transactions -->
        <button class="action-card rounded-2xl p-6 flex flex-col items-center justify-center gap-3 text-center">
          <div class="w-12 h-12 rounded-xl bg-orange-500/10 border border-orange-500/20 flex items-center justify-center">
            <svg class="w-6 h-6 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
          <span class="text-xs font-semibold text-zinc-200">Transactions</span>
        </button>

        <!-- Settings -->
        <button class="action-card rounded-2xl p-6 flex flex-col items-center justify-center gap-3 text-center">
          <div class="w-12 h-12 rounded-xl bg-zinc-800/80 border border-zinc-700/50 flex items-center justify-center">
            <svg class="w-6 h-6 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
          </div>
          <span class="text-xs font-semibold text-zinc-200">Settings</span>
        </button>

        <!-- SMS Verify -->
        <button class="action-card rounded-2xl p-6 flex flex-col items-center justify-center gap-3 text-center">
          <div class="w-12 h-12 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center">
            <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
            </svg>
          </div>
          <span class="text-xs font-semibold text-zinc-200">SMS Verify</span>
        </button>

      </div>
    </div>

  </main>

  <!-- Always Visible Fixed Bottom Glass Navigation Bar -->
  <nav class="fixed bottom-0 inset-x-0 glass-nav z-50 px-3 py-2">
    <div class="max-w-md mx-auto flex items-center justify-between sm:justify-around">
      <button class="flex-1 sm:flex-none flex flex-col items-center gap-1 py-2 px-3 rounded-xl bg-blue-500/15 text-blue-400 border border-blue-500/20 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        <span class="text-[9px] font-bold tracking-wider uppercase">HOME</span>
      </button>      
      <button class="flex-1 sm:flex-none flex flex-col items-center gap-1 py-2 px-3 text-zinc-400 hover:text-white transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
        </svg>
        <span class="text-[9px] font-bold tracking-wider uppercase">LINKS</span>
      </button>      
      <button class="flex-1 sm:flex-none flex flex-col items-center gap-1 py-2 px-3 text-zinc-400 hover:text-white transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        <span class="text-[9px] font-bold tracking-wider uppercase">CREDIT</span>
      </button>      
      <button class="flex-1 sm:flex-none flex flex-col items-center gap-1 py-2 px-3 text-zinc-400 hover:text-white transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <span class="text-[9px] font-bold tracking-wider uppercase">PRO</span>
      </button>
    </div>
  </nav>

</body>
</html>
